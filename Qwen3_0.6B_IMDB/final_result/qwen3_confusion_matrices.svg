<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-0.6B confusion matrices</title>
  <desc id="desc">Three two-by-two confusion matrices for zero-shot, few-shot and LoRA fine-tuned Qwen3-0.6B on the official IMDB test set.</desc>
  <rect width="1320" height="590" fill="#ffffff"/>
  <text x="660" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Qwen3-0.6B: Confusion-Matrix Progression</text>
  <text x="660" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5d6678">Rows = true class; columns = predicted class. Prompting matrices exclude invalid outputs.</text>
  <g transform="translate(75 112)" font-family="Arial, sans-serif">
    <text x="170" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Zero-shot</text>
    <text x="170" y="26" text-anchor="middle" font-size="14" fill="#a0473c">170 invalid outputs</text>
    <text x="210" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">Predicted</text>
    <text x="130" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Negative</text><text x="290" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Positive</text>
    <text x="28" y="242" transform="rotate(-90 28 242)" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">True class</text>
    <text x="65" y="167" text-anchor="end" font-size="13" fill="#5d6678">Negative</text><text x="65" y="327" text-anchor="end" font-size="13" fill="#5d6678">Positive</text>
    <rect x="80" y="100" width="160" height="160" fill="#4f86d9"/><rect x="240" y="100" width="160" height="160" fill="#bfd3f4"/>
    <rect x="80" y="260" width="160" height="160" fill="#eef4fb"/><rect x="240" y="260" width="160" height="160" fill="#1d4ed8"/>
    <g text-anchor="middle" font-size="27" font-weight="700">
      <text x="160" y="190" fill="#ffffff">8,893</text><text x="320" y="190" fill="#172033">3,512</text>
      <text x="160" y="350" fill="#172033">374</text><text x="320" y="350" fill="#ffffff">12,051</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#5d6678">
      <text x="160" y="215" fill="#ffffff">TN</text><text x="320" y="215">FP</text>
      <text x="160" y="375">FN</text><text x="320" y="375" fill="#ffffff">TP</text>
    </g>
  </g>
  <g transform="translate(490 112)" font-family="Arial, sans-serif">
    <text x="170" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Few-shot</text>
    <text x="170" y="26" text-anchor="middle" font-size="14" fill="#a0473c">3 invalid outputs</text>
    <text x="210" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">Predicted</text>
    <text x="130" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Negative</text><text x="290" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Positive</text>
    <text x="28" y="242" transform="rotate(-90 28 242)" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">True class</text>
    <text x="65" y="167" text-anchor="end" font-size="13" fill="#5d6678">Negative</text><text x="65" y="327" text-anchor="end" font-size="13" fill="#5d6678">Positive</text>
    <rect x="80" y="100" width="160" height="160" fill="#376ed0"/><rect x="240" y="100" width="160" height="160" fill="#d5e3f7"/>
    <rect x="80" y="260" width="160" height="160" fill="#eaf1fa"/><rect x="240" y="260" width="160" height="160" fill="#1f50d7"/>
    <g text-anchor="middle" font-size="27" font-weight="700">
      <text x="160" y="190" fill="#ffffff">10,462</text><text x="320" y="190" fill="#172033">2,036</text>
      <text x="160" y="350" fill="#172033">591</text><text x="320" y="350" fill="#ffffff">11,908</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#5d6678">
      <text x="160" y="215" fill="#ffffff">TN</text><text x="320" y="215">FP</text>
      <text x="160" y="375">FN</text><text x="320" y="375" fill="#ffffff">TP</text>
    </g>
  </g>
  <g transform="translate(905 112)" font-family="Arial, sans-serif">
    <text x="170" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">LoRA fine-tuned</text>
    <text x="170" y="26" text-anchor="middle" font-size="14" fill="#1f7555">0 invalid outputs</text>
    <text x="210" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">Predicted</text>
    <text x="130" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Negative</text><text x="290" y="84" text-anchor="middle" font-size="13" fill="#5d6678">Positive</text>
    <text x="28" y="242" transform="rotate(-90 28 242)" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6678">True class</text>
    <text x="65" y="167" text-anchor="end" font-size="13" fill="#5d6678">Negative</text><text x="65" y="327" text-anchor="end" font-size="13" fill="#5d6678">Positive</text>
    <rect x="80" y="100" width="160" height="160" fill="#1f50d7"/><rect x="240" y="100" width="160" height="160" fill="#edf3fb"/>
    <rect x="80" y="260" width="160" height="160" fill="#e8f0fa"/><rect x="240" y="260" width="160" height="160" fill="#2456d8"/>
    <g text-anchor="middle" font-size="27" font-weight="700">
      <text x="160" y="190" fill="#ffffff">11,976</text><text x="320" y="190" fill="#172033">524</text>
      <text x="160" y="350" fill="#172033">690</text><text x="320" y="350" fill="#ffffff">11,810</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#5d6678">
      <text x="160" y="215" fill="#ffffff">TN</text><text x="320" y="215">FP</text>
      <text x="160" y="375">FN</text><text x="320" y="375" fill="#ffffff">TP</text>
    </g>
  </g>
  <text x="660" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6678">The dominant zero-shot error is negative to positive; demonstrations reduce it, while LoRA nearly removes the asymmetry.</text>
</svg>
